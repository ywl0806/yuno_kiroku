name: yuno

services:
  app:
    build:
      context: .
      dockerfile: docker/local/Dockerfile
    ports:
      - 1323:1323
    volumes:
      - .:/app
    depends_on:
      - postgres
      - minio
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5433/yuno?sslmode=disable
      AI_API_URL: http://ai:8000
      STORAGE_TYPE: minio
      S3_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password
      AWS_REGION: us-east-1
      THUMBNAIL_BUCKET: thumbnail
      ORIGINAL_BUCKET: original

    networks:
      - app-net
  ai:
    build:
      context: ../ai
      dockerfile: docker/local/Dockerfile
    ports:
      - 8000:8000
    volumes:
      - ../ai:/app
    networks:
      - app-net
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yuno
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: s3-minio
    ports:
      - "9001:9000"
      - "9090:9090"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9090"
    volumes:
      - "minio:/data"
    networks:
      - app-net

  create-buckets:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: mc
    depends_on:
      - minio
    volumes:
      - minio:/data
    networks:
      - app-net
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 root password;
      mc mb --ignore-existing myminio/my-bucket;
      echo 'Buckets created successfully';
      "

networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
  minio:
    driver: local
