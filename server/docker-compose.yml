name: yuno

services:
  app:
    build:
      context: .
      dockerfile: docker/local/Dockerfile
    ports:
      - 1323:1323
    volumes:
      - .:/app
    depends_on:
      - postgres
      - minio
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5433/yuno?sslmode=disable
      AI_API_URL: http://ai:8000
      STORAGE_TYPE: minio
      S3_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password
      STORAGE_BUCKET: yuno-media
      AWS_REGION: us-east-1

    networks:
      - app-net
  ai:
    build:
      context: ../ai
      dockerfile: docker/local/Dockerfile
    ports:
      - 8000:8000
    volumes:
      - ../ai:/app
    networks:
      - app-net

  ai-batch:
    build:
      context: ../ai
      dockerfile: docker/local/Dockerfile
    command: ["python", "-m", "src.batch.face_recognition_batch"]
    volumes:
      - ../ai:/app
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5433/yuno?sslmode=disable
      STORAGE_TYPE: minio
      S3_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: yuno-media
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password
      AWS_REGION: us-east-1
    depends_on:
      - postgres
      - minio
    networks:
      - app-net
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yuno
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net

  resize-worker:
    build:
      context: .
      dockerfile: docker/local/Dockerfile.resize-worker
    ports:
      - "1325:1325"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5433/yuno?sslmode=disable
      STORAGE_TYPE: minio
      S3_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password
      STORAGE_BUCKET: yuno-media
      AWS_REGION: us-east-1
      PORT: "1325"
    depends_on:
      - postgres
      - minio
    networks:
      - app-net

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: s3-minio
    ports:
      - "9001:9000"
      - "9090:9090"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password
      # original/ 업로드 시 resize-worker로 webhook 전송
      MINIO_NOTIFY_WEBHOOK_ENABLE_1: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_1: http://resize-worker:1325/resize
    command: server /data --console-address ":9090"
    volumes:
      - "minio:/data"
    networks:
      - app-net

  create-buckets:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: mc
    depends_on:
      - minio
      - resize-worker
    networks:
      - app-net
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 root password; do
        echo 'MinIO 연결 대기 중...';
        sleep 2;
      done;
      mc mb --ignore-existing myminio/yuno-media;
      mc anonymous set download myminio/yuno-media;
      mc event add myminio/yuno-media arn:minio:sqs::1:webhook --event put --prefix original/ || true;
      mc cors set --config-file /dev/stdin myminio/yuno-media << 'EOF'
      {\"CORSRules\":[{\"AllowedHeaders\":[\"*\"],\"AllowedMethods\":[\"GET\",\"PUT\"],\"AllowedOrigins\":[\"http://localhost:5155\"],\"ExposeHeaders\":[\"ETag\"]}]}
      EOF
      echo '버킷, CORS 및 이벤트 설정 완료';
      "

networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
  minio:
    driver: local
