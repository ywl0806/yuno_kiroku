name: yuno

services:
  app:
    build:
      context: .
      dockerfile: docker/local/app/Dockerfile
    ports:
      - 1323:1323
    volumes:
      - .:/app
    depends_on: [postgres]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/yuno?sslmode=disable
    networks:
      - app-net

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yuno
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: s3-minio
    ports:
      - "9000:9000"
      - "9090:9090"
    environment:
      MINIO_ROOT_USER: access_key
      MINIO_ROOT_PASSWORD: secret_key
    command: server /data --console-address ":9090"
    volumes:
      - "minio:/data"
    networks:
      - app-net
networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
  minio:
    driver: local
